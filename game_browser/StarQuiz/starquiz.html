<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarQuiz</title>
    <link rel="stylesheet" href="starquiz.css">
</head>
<body>
    <h3 id="score">0</h3> <!--кол-во правильных ответов-->
    <div id="panel1"> <!--просто панел для вопросов и ответов (рамка если не умничать)-->
        <h3 id="quest"></h3> <!--задание или вопрос-->

        <div id="answer"> <!-- чтобы показать/стрыть используй document.getElementById("answer").style.display = "grid"/"none" -->
            <input type="text" placeholder="Введите ответ" class="answer1"> <!-- Способ ответа №1 просто табло ввода + кнопка изначально скрыт но можешь показать  -->
            <button class="answer1" id="test"></button> 

        </div>
        

        <div id="answers-grid"> <!-- чтобы показать/стрыть используй document.getElementById("answers-grid").style.display = "grid"/"none" -->
            <div class="answer2" id="a"></div> <!--  Способ ввода №2 4 варианта ответа биндишь через id элемента и через switch или if прверяешь ответ-->
            <div class="answer2" id="b"></div>
            <div class="answer2" id="c"></div>
            <div class="answer2" id="d"></div>
        </div>
    </div>


    <script src="starquiz.js"></script>
</body>
</html>
