<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>космочервь</title>
    <link rel="icon" href="../../favicon.ico">
    <link rel="stylesheet" href="python.css">
</head>
<body>

    <div id="setting">
        <div id="speed">
            <button id="x1" onclick="speed(this)">X1</button>
            <button id="x2" onclick="speed(this)">X2</button>
            <button id="x3" onclick="speed(this)">X3</button>
            <button id="x4" onclick="speed(this)">X4</button>
            <button id="x5" onclick="speed(this)">X5</button>
        </div>
        <button onclick="toggleButtons()" id="toggleBtn">Кнопки</button>
        <button id="start" onclick="start(this)">Старт</button>
    </div>


    
    <canvas id="snake" width="500" height="500"></canvas>
    <h3 id="score">0</h3>
     <div id="contein">
        <button id="up" onclick="side(this)">▲</button>
        <div>
            <button id="left" onclick="side(this)">◄</button>
            <button id="down" onclick="side(this)">▼</button>
            <button id="right" onclick="side(this)">►</button>
        </div>
    </div>

    <script src="python.js"></script>
    
</body>
</html>
